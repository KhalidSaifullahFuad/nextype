[package]
name = "nextype"
edition.workspace = true
version.workspace = true

[lib]
doctest = false

[dependencies]
dispatch2 = "=0.3.1"
libc = "0.2"
serde_json = "1"
rusqlite = { version = "=0.43.0", features = ["bundled-sqlcipher"] }
security-framework = "=3.7.0"
nextype-ax = { version = "0.1.0", path = "../ax" }
nextype-core = { version = "0.1.0", path = "../core" }
nextype-engine = { version = "0.1.0", path = "../engine" }
objc2 = "0.6"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSPanel", "NSWindow", "NSView", "NSControl", "NSTextField", "NSColor", "NSFont", "NSScreen", "NSGraphics", "NSAttributedString", "NSParagraphStyle", "NSText", "NSStringDrawing", "NSPasteboard", "NSPasteboardItem", "objc2-core-foundation"] }
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "libc", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSGeometry", "NSAttributedString", "NSDictionary", "NSLocale", "NSPathUtilities", "NSEnumerator", "NSData"] }
